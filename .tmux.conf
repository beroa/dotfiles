set -g base-index 1
setw -g pane-base-index 1

set -g mouse on
set -sg escape-time 10

# True color / RGB for inner TUIs (e.g. Cursor Agent). Without this, colors often
# collapse to a few bright ANSI colors inside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features ',*:paste:clipboard'

set-option -g history-limit 25000

# remap prefix from 'C-b' to 'A-w'
unbind C-b
set-option -g prefix M-w
bind-key M-w send-prefix

#bind-key -n 'C-b' copy-mode
bind v copy-mode

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload config and confirm in the status line.
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# clear scrollback and searchback with C
bind-key C-k send-keys -R \; send-keys C-l \; clear-history \; send-keys -R \; send-keys C-l \; refresh-client

# split panes using | and -
bind '\' split-window -h
bind - split-window -v
unbind '"'
unbind %

# use vim copy bindings. and use clipboard.
set-window-option -g mode-keys vi
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; elif command -v clip.exe >/dev/null 2>&1; then clip.exe; else cat >/dev/null; fi'"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; elif command -v clip.exe >/dev/null 2>&1; then clip.exe; else cat >/dev/null; fi'"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

#set inactive/active window styles
set -g window-style 'default'
set -g window-active-style 'default'

# set the pane border colors
# set -g pane-border-style 'fg=colour51,bg=default'
# set -g pane-active-border-style 'fg=#2c2c2f,bg=#2c2c2f'
set -g pane-border-style 'fg=#2c2c2f,bg=default'
set -g pane-active-border-style 'fg=colour51,bg=default'

set -g status-bg '#000000'
set -g status-fg 'colour51'
set -g status-position top
# Clear any previously configured left status content from older configs.
set -g status-left ''
set -gu status-left-length
set -g status-right '%y-%b-%d %I:%M %p'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"
